<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1060" viewBox="0 0 1360 1060" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="dE" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecfdf5"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="dO" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="dS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0f9ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="dV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f3ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <clipPath id="frame"><rect x="40" y="120" width="1280" height="880" rx="16"/></clipPath>
    <style>
      .brand{font-weight:800;font-size:18px;fill:#0f172a}
      .chip{font-weight:600;font-size:12px;fill:#047857}
      .nav{font-weight:600;font-size:14px;fill:#475569}
      .sub{font-size:15px;fill:#475569}
      .secttl{font-weight:800;font-size:22px;fill:#0f172a}
      .cardttl{font-weight:700;font-size:17px;fill:#0f172a}
      .cardsum{font-size:13px;fill:#475569}
      .ctaw{font-weight:700;font-size:13px;fill:#ffffff}
      .btnpri{font-weight:700;font-size:15px;fill:#ffffff}
      .btnsec{font-weight:700;font-size:14px;fill:#334155}
      .small{font-size:11px;fill:#94a3b8}
      .metric{font-weight:800;font-size:12px;fill:#047857}
      .qt{font-size:11px;fill:#475569}
    </style>
  </defs>

  <rect width="1360" height="1060" fill="#f1f5f9"/>
  <text x="40" y="58" font-weight="800" font-size="26" fill="#0f172a">셀프마케팅 — 데스크톱 시안</text>
  <text x="40" y="86" font-size="14" fill="#64748b">반응형 웹앱 (PWA) · 랜딩 / · 1280px 뷰포트 · 카드 4열</text>

  <!-- browser frame -->
  <rect x="40" y="120" width="1280" height="880" rx="16" fill="#ffffff" stroke="#e2e8f0"/>
  <g clip-path="url(#frame)">
    <!-- chrome bar -->
    <rect x="40" y="120" width="1280" height="44" fill="#f8fafc"/>
    <circle cx="68" cy="142" r="6" fill="#fb7185"/><circle cx="88" cy="142" r="6" fill="#fbbf24"/><circle cx="108" cy="142" r="6" fill="#34d399"/>
    <rect x="150" y="130" width="1080" height="24" rx="12" fill="#eef2f7"/>
    <text x="170" y="147" class="small">🔒  selfmarketing.app</text>

    <!-- header -->
    <text x="72" y="204" font-size="18">🌱</text>
    <text x="98" y="204" class="brand">셀프마케팅</text>
    <text x="1140" y="204" class="nav">마이페이지</text>
    <rect x="1216" y="184" width="72" height="34" rx="8" fill="#059669"/>
    <text x="1252" y="206" text-anchor="middle" class="ctaw">시작하기</text>
    <line x1="40" y1="232" x2="1320" y2="232" stroke="#f1f5f9"/>

    <!-- hero -->
    <rect x="40" y="232" width="1280" height="268" fill="url(#hero)"/>
    <rect x="500" y="258" width="360" height="28" rx="14" fill="#d1fae5"/>
    <text x="680" y="277" text-anchor="middle" class="chip">소상공인 · 온라인 셀러 · 매장 운영자를 위한 셀프 마케팅</text>
    <text x="680" y="332" text-anchor="middle" font-weight="800" font-size="40" fill="#0f172a">대행사 없이도 손쉽게</text>
    <text x="680" y="382" text-anchor="middle" font-weight="800" font-size="40" fill="#0f172a">마케팅을 시작하세요</text>
    <text x="680" y="420" text-anchor="middle" class="sub">상위 노출부터 방문 고객 증가, 판매량 극대화, 광고비 환급까지.</text>
    <rect x="517" y="446" width="166" height="46" rx="12" fill="#059669"/>
    <text x="600" y="475" text-anchor="middle" class="btnpri">무료로 시작하기</text>
    <rect x="697" y="446" width="146" height="46" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="770" y="475" text-anchor="middle" class="btnsec">서비스 둘러보기</text>

    <!-- section -->
    <text x="680" y="556" text-anchor="middle" class="secttl">무엇을 해결하고 싶으신가요?</text>
    <text x="680" y="582" text-anchor="middle" class="sub">우리 매장에 필요한 것부터 골라 바로 시작할 수 있습니다.</text>

    <!-- 4 cards -->
    <!-- place -->
    <g transform="translate(84,612)">
      <rect width="280" height="214" rx="16" fill="url(#dE)" stroke="#ecfdf5"/>
      <rect x="24" y="24" width="52" height="52" rx="13" fill="#d1fae5"/>
      <text x="50" y="60" text-anchor="middle" font-size="24">📍</text>
      <text x="24" y="110" class="cardttl">플레이스 광고</text>
      <text x="24" y="138" class="cardsum">지역 검색 상위 노출로</text>
      <text x="24" y="158" class="cardsum">매장 방문 고객 증대</text>
      <rect x="24" y="172" width="232" height="42" rx="11" fill="#059669"/>
      <text x="140" y="199" text-anchor="middle" class="ctaw">플레이스 진단 받기</text>
    </g>
    <!-- shopping -->
    <g transform="translate(388,612)">
      <rect width="280" height="214" rx="16" fill="url(#dO)" stroke="#fff7ed"/>
      <rect x="24" y="24" width="52" height="52" rx="13" fill="#ffedd5"/>
      <text x="50" y="60" text-anchor="middle" font-size="24">🛍️</text>
      <text x="24" y="110" class="cardttl">네이버 쇼핑 광고</text>
      <text x="24" y="138" class="cardsum">쇼핑 검색 상위 노출로</text>
      <text x="24" y="158" class="cardsum">판매량 극대화</text>
      <rect x="24" y="172" width="232" height="42" rx="11" fill="#f97316"/>
      <text x="140" y="199" text-anchor="middle" class="ctaw">쇼핑 광고 신청하기</text>
    </g>
    <!-- blog -->
    <g transform="translate(692,612)">
      <rect width="280" height="214" rx="16" fill="url(#dS)" stroke="#f0f9ff"/>
      <rect x="24" y="24" width="52" height="52" rx="13" fill="#e0f2fe"/>
      <text x="50" y="60" text-anchor="middle" font-size="24">✍️</text>
      <text x="24" y="110" class="cardttl">네이버 블로그 광고</text>
      <text x="24" y="138" class="cardsum">블로그 상위 노출로</text>
      <text x="24" y="158" class="cardsum">브랜드 신뢰도 향상</text>
      <rect x="24" y="172" width="232" height="42" rx="11" fill="#0284c7"/>
      <text x="140" y="199" text-anchor="middle" class="ctaw">블로그 광고 시작하기</text>
    </g>
    <!-- refund -->
    <g transform="translate(996,612)">
      <rect width="280" height="214" rx="16" fill="url(#dV)" stroke="#f5f3ff"/>
      <rect x="24" y="24" width="52" height="52" rx="13" fill="#ede9fe"/>
      <text x="50" y="60" text-anchor="middle" font-size="24">💸</text>
      <text x="24" y="110" class="cardttl">광고비 환급</text>
      <text x="24" y="138" class="cardsum">네이버·카카오 광고비</text>
      <text x="24" y="158" class="cardsum">일부를 매월 환급</text>
      <rect x="24" y="172" width="232" height="42" rx="11" fill="#7c3aed"/>
      <text x="140" y="199" text-anchor="middle" class="ctaw">광고비 환급 확인하기</text>
    </g>

    <!-- success stories -->
    <text x="680" y="884" text-anchor="middle" class="secttl">직접 시작한 사장님들의 성과</text>
    <g transform="translate(84,908)">
      <rect width="280" height="76" rx="14" fill="#ffffff" stroke="#eef2f7"/>
      <rect x="20" y="18" width="96" height="22" rx="11" fill="#ecfdf5"/><text x="68" y="33" text-anchor="middle" class="metric">노출 +320%</text>
      <text x="20" y="60" class="qt">온라인 셀러 · 도입 3개월 · 월매출 +180%</text>
    </g>
    <g transform="translate(388,908)">
      <rect width="280" height="76" rx="14" fill="#ffffff" stroke="#eef2f7"/>
      <rect x="20" y="18" width="116" height="22" rx="11" fill="#ecfdf5"/><text x="78" y="33" text-anchor="middle" class="metric">신규 방문 +140%</text>
      <text x="20" y="60" class="qt">동네 카페 · 도입 2개월 · 플레이스 1위</text>
    </g>
    <g transform="translate(692,908)">
      <rect width="280" height="76" rx="14" fill="#ffffff" stroke="#eef2f7"/>
      <rect x="20" y="18" width="108" height="22" rx="11" fill="#ecfdf5"/><text x="74" y="33" text-anchor="middle" class="metric">예약 문의 +95%</text>
      <text x="20" y="60" class="qt">뷰티 스튜디오 · 도입 4개월 · 후기 자동화</text>
    </g>
    <g transform="translate(996,908)">
      <rect width="280" height="76" rx="14" fill="#ffffff" stroke="#eef2f7"/>
      <rect x="20" y="18" width="124" height="22" rx="11" fill="#ecfdf5"/><text x="82" y="33" text-anchor="middle" class="metric">환급 누적 240만원</text>
      <text x="20" y="60" class="qt">소형 쇼핑몰 · 도입 6개월 · 수익률 +12%p</text>
    </g>
  </g>

  <text x="40" y="1040" font-size="13" fill="#94a3b8">모바일 1열 → 태블릿 2열 → 데스크톱 4열 · 카드별 포인트 컬러 차등 · 호버 시 살짝 떠오르는 인터랙션</text>
</svg>
