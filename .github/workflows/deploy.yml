name: Deploy to GitHub Pages

# Builds the Next.js static export and publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (configure-pages also attempts to enable it automatically).

on:
  push:
    branches:
      - claude/pensive-fermat-MZ94X
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of the same group.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # A custom domain serves the site at the root, so basePath must be empty.
      # We can't read that from configure-pages on the very first run: Pages only
      # learns the domain from the CNAME we are about to publish, so its outputs
      # still describe the old project-site URL. Setting the PAGES_CUSTOM_DOMAIN
      # repo Variable overrides both, which also makes the cutover a one-switch
      # change instead of a commit.
      - name: Resolve base path and canonical URL
        id: site
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          PAGES_ORIGIN: ${{ steps.pages.outputs.origin }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
            echo "site_url=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=$PAGES_BASE_PATH" >> "$GITHUB_OUTPUT"
            echo "site_url=$PAGES_ORIGIN$PAGES_BASE_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        env:
          # Project site is served under /<repo>; a custom domain serves at root.
          NEXT_PUBLIC_BASE_PATH: ${{ steps.site.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.site_url }}
          # Real auth + cash backend (Supabase). Set these as repo Variables to
          # switch from local stub to real signup/login. Empty = stub mode.
          # (anon key is a publishable client key — safe to expose.)
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # "true" once each provider is enabled in Supabase Auth (Naver as the
          # custom:naver provider). Until then its buttons stay hidden — they'd
          # hit a "provider is not enabled" error. See docs/SOCIAL_LOGIN.md.
          NEXT_PUBLIC_KAKAO_LOGIN_ENABLED: ${{ vars.NEXT_PUBLIC_KAKAO_LOGIN_ENABLED }}
          NEXT_PUBLIC_NAVER_LOGIN_ENABLED: ${{ vars.NEXT_PUBLIC_NAVER_LOGIN_ENABLED }}
          # AI blog writer proxy (optional). Empty = demo mode.
          NEXT_PUBLIC_BLOG_API_URL: ${{ vars.NEXT_PUBLIC_BLOG_API_URL }}
          # Conversion tracking (GTM container). Empty = console fallback.
          NEXT_PUBLIC_GTM_ID: ${{ vars.NEXT_PUBLIC_GTM_ID }}
          # Admin dashboard allowlist (comma-separated emails). Empty = no admin.
          NEXT_PUBLIC_ADMIN_EMAILS: ${{ vars.NEXT_PUBLIC_ADMIN_EMAILS }}
          # Live price sheet (published CSV) + inquiry webhook (Apps Script).
          NEXT_PUBLIC_PRICE_SHEET_CSV_URL: ${{ vars.NEXT_PUBLIC_PRICE_SHEET_CSV_URL }}
          NEXT_PUBLIC_INQUIRY_WEBHOOK_URL: ${{ vars.NEXT_PUBLIC_INQUIRY_WEBHOOK_URL }}
          # Payment (PortOne) client keys. Empty = test-charge stub.
          NEXT_PUBLIC_PORTONE_STORE_ID: ${{ vars.NEXT_PUBLIC_PORTONE_STORE_ID }}
          NEXT_PUBLIC_PORTONE_CHANNEL_KEY: ${{ vars.NEXT_PUBLIC_PORTONE_CHANNEL_KEY }}
        run: npm run build

      - name: Disable Jekyll (serve _next assets as-is)
        run: touch out/.nojekyll

      # This deploy uploads out/ as an artifact rather than committing to a
      # branch, so the CNAME has to live inside the artifact. Without it Pages
      # drops the custom domain on every deploy.
      - name: Write CNAME for custom domain
        if: vars.PAGES_CUSTOM_DOMAIN != ''
        env:
          CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: printf '%s\n' "$CUSTOM_DOMAIN" > out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
